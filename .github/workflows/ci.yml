# Runs on every push / pull request to main: unit tests, production build, then the
# Cypress smoke specs against the built site. Cypress blocks all Firestore write channels
# (see cypress/e2e/homepage-deep-audit.cy.js), so CI never writes production data.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: "Lint (zero warnings, includes the CRM design-token guard)"
        run: npm run lint -- --max-warnings=0

      - name: Unit tests (finance, yield, trade-in matching)
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Cypress smoke tests (against vite preview)
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npx vite preview --port 4173 --strictPort
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 60
          spec: cypress/e2e/homepage-deep-audit.cy.js,cypress/e2e/homepage-navigation.cy.js,cypress/e2e/buyer-demands.cy.js
          config: baseUrl=http://localhost:4173,video=false

  rules:
    # Firestore security rules against the local emulator (no production data involved)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0  # this job runs no browser tests

      - name: Firestore rules tests
        run: npm run test:rules

  journey:
    # Public form → Firestore → CRM, end to end, against the Firestore + Auth emulators
    # (cypress/e2e/lead-journey.cy.js). The site is built pointing at the emulators; no production data.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build against the emulators
        run: npx vite build --outDir dist-journey
        env:
          VITE_FIREBASE_EMULATORS: 'true'

      - name: Lead journey (Cypress)
        uses: cypress-io/github-action@v7
        with:
          install: false
          # start is a comma-separated list, so the emulator command (which itself has a comma) lives in package.json
          start: npm run emulators:journey, npx vite preview --outDir dist-journey --host 127.0.0.1 --port 4174 --strictPort
          wait-on: 'http://127.0.0.1:8080, http://127.0.0.1:9099, http://127.0.0.1:4174'
          wait-on-timeout: 120
          spec: cypress/e2e/lead-journey.cy.js
          config: baseUrl=http://127.0.0.1:4174,video=false

  commits:
    # Every new commit needs a subject that says what it does (scripts/check-commit-message.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit messages
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          case "$RANGE" in 0000000000000000000000000000000000000000..*) echo "New branch: nothing to compare"; exit 0;; esac
          node scripts/check-commit-message.mjs --range "$RANGE"
