# An auto-assigned client nobody answered in 15 minutes moves once to another salesperson
# (scripts/reassign-unanswered.mjs). Does nothing unless CRM → الأتمتة has the option switched on, and only
# between 09:00 and 21:00 Cairo time. Run it once with «dry run» to see what it would move.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT (already used by the other workflows).
name: Reassign unanswered clients

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print who would be moved
        type: boolean
        default: true

concurrency:
  group: reassign-unanswered
  cancel-in-progress: false

env:
  TZ: Africa/Cairo

jobs:
  reassign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is missing."; exit 1; fi
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Reassign
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          npm install --no-save --no-package-lock --ignore-scripts firebase-admin@13
          if [ "$DRY_RUN" = "true" ]; then node scripts/reassign-unanswered.mjs --dry-run; else node scripts/reassign-unanswered.mjs; fi

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
