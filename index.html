    <!-- Some browsers refuse localStorage / sessionStorage outright (the access itself throws): in-app browsers, Chrome
         with cookies blocked, some private modes. The app reads them at start, so the page stayed blank. Replace a
         blocked one with an in-memory copy before anything else runs; nothing is saved across visits there. -->
    <script>
      (function () {
        ['localStorage', 'sessionStorage'].forEach(function (name) {
          try { window[name].getItem('__probe'); return; } catch (e) {}
          var data = {};
          var shim = {
            getItem: function (k) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
            setItem: function (k, v) { data[k] = String(v); },
            removeItem: function (k) { delete data[k]; },
            clear: function () { data = {}; },
            key: function (i) { return Object.keys(data)[i] || null; },
            get length() { return Object.keys(data).length; }
          };
          try { Object.defineProperty(window, name, { value: shim, configurable: true }); } catch (e2) {}
        });
      })();
    </script>

    <!-- If the app has not drawn anything 8 seconds after the page loaded (a script that failed to download or crashed
         before it started), a visitor saw a blank screen with no way out. Say so, give a reload button, and show the
         first error the browser reported, so a screenshot says what went wrong. It disappears once the app is on screen. -->
    <script>
      (function () {
        var errors = [];
        var note = function (m) { if (errors.length < 3) errors.push(String(m).slice(0, 160)); };
        window.addEventListener('error', function (e) { note((e && e.message) || 'error'); });
        window.addEventListener('unhandledrejection', function (e) { note((e && e.reason && (e.reason.message || e.reason)) || 'rejection'); });
        var mounted = function () {
          var root = document.getElementById('root');
          if (!root) return true;
          for (var i = 0; i < root.children.length; i++) { if (!root.children[i].classList.contains('seo-shell')) return true; }
          return false;
        };
        var box = null;
        var show = function () {
          if (box || mounted()) return;
          box = document.createElement('div');
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#0B1B32;color:#fff;font-family:Cairo,system-ui,sans-serif;text-align:center;direction:rtl';
          var h = document.createElement('strong'); h.style.fontSize = '20px'; h.textContent = 'الصفحة بتتأخر في التحميل';
          var p = document.createElement('p'); p.style.cssText = 'margin:0;opacity:.85;line-height:1.7'; p.textContent = 'ممكن النت ضعيف. جرّب تحدّث الصفحة.';
          var b = document.createElement('button'); b.type = 'button'; b.textContent = 'حدّث الصفحة';
          b.style.cssText = 'padding:12px 28px;border:0;border-radius:999px;background:#C9A96E;color:#0B1B32;font:700 16px Cairo,system-ui,sans-serif;cursor:pointer';
          b.addEventListener('click', function () { location.reload(); });
          box.appendChild(h); box.appendChild(p); box.appendChild(b);
          if (errors.length) {
            var d = document.createElement('small'); d.style.cssText = 'opacity:.6;direction:ltr;max-width:90vw;overflow-wrap:anywhere'; d.textContent = errors[0];
            box.appendChild(d);
          }
          document.body.appendChild(box);
        };
        setTimeout(show, 8000);
        setInterval(function () { if (box && mounted()) { box.parentNode && box.parentNode.removeChild(box); box = null; } }, 1000);
      })();
    </script>

    <!-- Theme pre-hydration (prevents flash of wrong theme) -->
    <script>
      (function() {
        try {

          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark-theme', theme === 'dark');
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>

    <!-- Homepage LCP: start the hero poster download before the lazy HomePage chunk runs.
         Same srcset as HERO_POSTER_DEFAULT in src/pages/HomePage.jsx. Other routes skip it. -->
    <!-- no crossorigin: <img> requests are no-cors, a CORS preconnect would not be reused -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <script>
      (function() {
        if (location.pathname !== '/') return;
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.setAttribute('fetchpriority', 'high');
        // A live hero campaign (cached by src/utils/adCampaigns.js) replaces the default poster
        try {
          var now = Date.now(), day = function (v, end) { if (!v) return null; var p = String(v).split('-'); return new Date(+p[0], p[1] - 1, +p[2], end ? 23 : 0, end ? 59 : 0).getTime(); };
          var ads = JSON.parse(localStorage.getItem('oneline_ad_campaigns') || '[]').filter(function (c) {
            return c && c.active && c.placement === 'hero' && /^https:/.test(c.imageDesktop || '') &&
              (!c.startAt || now >= day(c.startAt)) && (!c.endAt || now <= day(c.endAt, true));
          }).sort(function (a, b) { return (b.priority || 0) - (a.priority || 0); });
          if (ads[0]) {
            var mobile = ads[0].imageMobile && window.matchMedia('(max-width: 700px)').matches;
            l.href = mobile ? ads[0].imageMobile : ads[0].imageDesktop;
            document.head.appendChild(l);
            return;
          }
        } catch (e) {}
        // URLs must match the <img srcset> byte-for-byte or the image downloads twice
        var u = function (w) { return 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=' + w + '&q=70'; };
        l.setAttribute('imagesrcset', u(640) + ' 640w, ' + u(960) + ' 960w, ' + u(1600) + ' 1600w');
        l.setAttribute('imagesizes', '100vw');
        document.head.appendChild(l);
      })();
    </script>
